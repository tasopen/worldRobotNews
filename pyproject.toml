[project]
name = "worldRobotNews"
version = "0.1.0"
description = "Robot news podcast generator — collect, summarise, synthesise, and publish daily episodes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.33.1",
  "feedparser>=6.0.12",
  "python-dateutil>=2.9.0.post0",
  "google-genai>=1.73.1",
  "pyyaml>=6.0.3",
]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]

