# 臨時メッセージ（お知らせ）
#
# 放送日（JST）を指定して文言を登録すると、その日のエピソードだけ
# Greeting の直後に読み上げられます。
#
#   Greeting → 臨時メッセージ → ニュースのヘッドライン → 本文
#
# 仕様:
#   - date:    YYYY-MM-DD（日本時間）。その日のみ有効。
#   - text:    読み上げる文言。LLM を通さず一字一句そのまま音声化されます。
#   - enabled: false で一時停止（省略時は true）。
#
# 運用メモ:
#   - 過去日付のエントリは自動的に無視されるため、削除し忘れても実害はありません。
#   - 同日に複数件ある場合は、上から順に連結して読み上げます。
#   - TTS に直接渡るため、括弧はふりがな以外に使わないでください。
#     英語・略語・記号を避け、句点で終えると読み上げが安定します。
#   - この文言はフィードの description には含まれません（音声と SRT のみ）。

announcements:
  - date: 2026-11-21
    text: "ごめんなさい。昨日11月20日、間違えて2回配信してしまいました。配信の仕組みを直したので、今日以降は大丈夫なはずです。それでは、本日のニュース。"
    enabled: true
