name: Migrate Episodes to Releases

# GitHub Pages の 1 GB 上限を解消するための一度きりの移行用。
# 既存エピソードを Releases へ退避し、feed.xml の URL を差し替える。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "アップロードせず対象だけ表示する"
        type: boolean
        default: true
      delete_local:
        description: "退避後に docs/episodes の MP3 を削除する（Pages 容量が減る）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Archive all episodes
        timeout-minutes: 120
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ARGS="--all --allow-partial"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.delete_local }}" = "true" ]; then
            ARGS="$ARGS --delete-local"
          fi
          uv run python scripts/archive_episode.py $ARGS

      # 部分成功でも feed.xml の書き換えと実体削除をコミットする
      - name: Commit and push changes
        if: ${{ always() && inputs.dry_run == false }}
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: migrate episode media to releases [skip ci]"
          git fetch origin
          git pull --rebase origin master || true
          git push origin master || true
